<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS X</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#03070b;color:#eaffff;font-family:system-ui,Arial}.app{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.logo{color:#00eaff;font-weight:900;letter-spacing:6px;font-size:25px}.state{font-size:11px;color:#7eefff;border:1px solid #17566a;padding:7px 10px;border-radius:20px}.orb{width:150px;height:150px;border-radius:50%;margin:35px auto 20px;background:radial-gradient(circle,#fff,#00eaff 9%,#08758d 27%,transparent 67%);box-shadow:0 0 30px #00eaff,0 0 100px #00657d;animation:p 2s infinite}.chat{height:52vh;overflow:auto;border:1px solid #183746;border-radius:18px;background:#061019;padding:12px}.m{padding:11px 13px;border-radius:13px;margin:8px 0;line-height:1.5;white-space:pre-wrap}.u{background:#0b2732;margin-left:12%}.a{background:#091820;margin-right:8%}.tag{font-size:10px;color:#00eaff;letter-spacing:1px}.bar{display:flex;gap:8px;margin-top:10px}.bar input{flex:1;background:#071018;border:1px solid #234354;color:white;border-radius:13px;padding:14px}.btn{background:#082c37;border:1px solid #00aeca;color:white;border-radius:13px;padding:0 15px;font-weight:700}.mic{font-size:20px;width:54px}.note{text-align:center;color:#607986;font-size:11px;margin-top:10px}@keyframes p{50%{transform:scale(1.06);filter:brightness(1.3)}}
</style></head><body><main class="app"><div class="top"><div class="logo">JARVIS X</div><div class="state" id="st">ONLINE</div></div><div class="orb"></div><div class="chat" id="chat"></div><div class="bar"><input id="q" placeholder="Ask JARVIS anything…"><button class="btn" id="send">SEND</button><button class="btn mic" id="mic">🎙</button></div><div class="note">OpenAI-powered • multilingual • voice input/output • API key stays on the server</div></main>
<script>
const $=id=>document.getElementById(id),chat=$('chat');let hist=JSON.parse(localStorage.getItem('jx')||'[]'),rec;
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function add(role,text,save=true){let d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');d.innerHTML='<div class="tag">'+(role==='user'?'YOU':'JARVIS')+'</div>'+esc(text);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(save){hist.push({role,content:text});localStorage.setItem('jx',JSON.stringify(hist.slice(-40)))}}
hist.forEach(x=>add(x.role,x.content,false));if(!hist.length)add('assistant','Hello. I am JARVIS X. Ask me anything.');
async function ask(q){q=q.trim();if(!q)return;add('user',q);$('q').value='';$('st').textContent='THINKING';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:hist.slice(0,-1)})});let j=await r.json();if(!r.ok)throw Error(j.detail||j.error);add('assistant',j.reply);speak(j.reply)}catch(e){add('assistant','I could not connect to the AI server. Check your API key/server.')}$('st').textContent='ONLINE'}
function speak(t){if(!speechSynthesis)return;let u=new SpeechSynthesisUtterance(t);speechSynthesis.cancel();speechSynthesis.speak(u)}
$('send').onclick=()=>ask($('q').value);$('q').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
$('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Speech recognition is not supported. Use Chrome.');if(rec){rec.stop();rec=null;$('st').textContent='ONLINE';return}rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.onstart=()=>{$('st').textContent='LISTENING'};rec.onresult=e=>{$('q').value=e.results[0][0].transcript;ask($('q').value)};rec.onend=()=>{$('st').textContent='ONLINE';rec=null};rec.start()}
</script></body></html>
